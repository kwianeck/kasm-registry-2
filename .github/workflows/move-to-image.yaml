name: Push to GHCR after pages build and deployment

on:
  workflow_run:
    workflows:
      - "pages build and deployment"
      - "pages-build-deployment"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  push-to-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows branch (Dockerfile)
        uses: actions/checkout@v4
        with:
          ref: "1.1"

      - name: Checkout gh-pages branch (site content)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next semantic tag (X.Y.Z)
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="kasm-registry-server"

          echo "Fetching existing tags from GHCR for: $OWNER/$REPO"

          TAGS=$(gh api -H "Accept: application/vnd.github+json" \
            /users/$OWNER/packages/container/$REPO/versions \
            | jq -r '.[].metadata.container.tags[]' | sort -u)

          SEMVER_TAGS=$(echo "$TAGS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)

          if [ -z "$SEMVER_TAGS" ]; then
            echo "No semantic versions found — starting with 1.0.0"
            NEXT_TAG="1.0.0"
            LAST_TAG="none"
          else
            LAST_TAG=$(echo "$SEMVER_TAGS" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
            MAJOR=$(echo "$LAST_TAG" | cut -d. -f1)
            MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LAST_TAG" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEXT_TAG="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Previous tag: $LAST_TAG"
          echo "Next tag:     $NEXT_TAG"

          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "next_tag=$NEXT_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/kasm-registry-server
          TAG=${{ steps.get_tag.outputs.next_tag }}

          echo "Building image: $IMAGE:$TAG"
          docker build -f Dockerfile -t $IMAGE:$TAG -t $IMAGE:latest gh-pages
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
